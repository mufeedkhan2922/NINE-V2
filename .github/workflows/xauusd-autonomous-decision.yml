name: NINE XAUUSD Autonomous Decision Intelligence

on:
  push:
    branches: [main]
    paths:
      - "lib/trading/**"
      - "scripts/run-xauusd-autonomous-decision.ts"
      - "tests/**"
      - "package.json"
      - ".github/workflows/xauusd-autonomous-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:autonomous-decision
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-autonomous-decision
          path: artifacts/xauusd-autonomous-decision.json
