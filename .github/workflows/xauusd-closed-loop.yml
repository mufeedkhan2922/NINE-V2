name: NINE XAUUSD Closed-Loop Learning
concurrency:
  group: nine-xauusd-provider-research
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:closed-loop
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NINE_LEARNING_START: "2026-08-01"
          NINE_LEARNING_END: "2026-09-29"
          NINE_PROVIDER_MAX_REQUESTS_PER_MINUTE: "6"
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-closed-loop
          path: artifacts/xauusd-closed-loop-cycle.*
