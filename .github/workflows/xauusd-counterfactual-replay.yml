name: NINE XAUUSD Counterfactual Replay

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/trading/counterfactual.ts"
      - "lib/trading/counterfactualReplay.ts"
      - "lib/trading/db.ts"
      - "tests/counterfactualReplay.test.ts"
      - "tests/testRunner.ts"
      - "scripts/run-xauusd-counterfactual-replay.ts"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:counterfactual-replay
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-counterfactual-replay
          path: artifacts/xauusd-counterfactual-replay.json
