name: NINE XAUUSD Policy Governance

on:
  push:
    branches: [main]
    paths:
      - "lib/trading/**"
      - "scripts/run-xauusd-policy-governance.ts"
      - "tests/**"
      - "package.json"
      - ".github/workflows/xauusd-policy-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:policy
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-policy-governance
          path: artifacts/xauusd-policy-governance.json
