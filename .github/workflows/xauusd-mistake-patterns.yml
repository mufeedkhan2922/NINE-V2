name: NINE XAUUSD Mistake Pattern Mining

on:
  workflow_dispatch:
  push:
    paths:
      - "lib/trading/mistakePatternMining.ts"
      - "lib/trading/causalLearning.ts"
      - "lib/trading/db.ts"
      - "tests/mistakePatternMining.test.ts"
      - "tests/testRunner.ts"
      - "scripts/run-xauusd-mistake-patterns.ts"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:mistake-patterns
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-mistake-patterns
          path: artifacts/xauusd-mistake-patterns.json
