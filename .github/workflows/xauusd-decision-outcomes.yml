name: NINE XAUUSD Decision Outcome Feedback

on:
  push:
    branches: [main]
    paths:
      - "lib/trading/**"
      - "scripts/run-xauusd-decision-outcomes.ts"
      - "tests/**"
      - "package.json"
      - ".github/workflows/xauusd-decision-outcomes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:decision-outcomes
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-decision-outcomes
          path: artifacts/xauusd-decision-outcomes.json
