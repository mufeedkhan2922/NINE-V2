name: NINE XAUUSD Regime Intelligence

concurrency:
  group: nine-xauusd-regime
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/trading/**"
      - "scripts/run-xauusd-regime.ts"
      - "tests/**"
      - "package.json"
      - ".github/workflows/xauusd-regime.yml"

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run research:xauusd:regime
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NINE_REGIME_START: "2026-08-01"
          NINE_REGIME_END: "2026-09-29"
      - uses: actions/upload-artifact@v4
        with:
          name: nine-xauusd-regime-intelligence
          path: artifacts/xauusd-regime-intelligence.json
